name: Test Prism input generation

on:
  pull_request:
    paths:
      - "scripts/prepare_prism_input.R"
      - "data/curated/**"
      - ".github/workflows/r-prepare-prism.yml"

  push:
    branches:
      - main
    paths:
      - "scripts/prepare_prism_input.R"
      - "data/curated/**"
      - ".github/workflows/r-prepare-prism.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-prism-input:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install required R packages
        run: |
          Rscript -e '
            install.packages(
              c(
                "readxl",
                "dplyr",
                "tidyr",
                "stringr",
                "writexl",
                "tibble"
              )
            )
          '

      - name: Generate Prism input
        run: |
          Rscript scripts/prepare_prism_input.R

      - name: Verify Prism input
        run: |
          test -f results/derived/Prism_input.xlsx

      - name: Upload generated Prism input
        uses: actions/upload-artifact@v4
        with:
          name: generated-prism-input
          path: results/derived/Prism_input.xlsx
          if-no-files-found: error
          retention-days: 14
