name: Test cristae LMM analysis

on:
  push:
    branches:
      - scripts/analyze-cristae-lmm
      - main
    paths:
      - "scripts/R/Cristae_LMM.R"
      - "data/curated/cristae_manual.xlsx"
      - "data/curated/cristae_automated.xlsx"
      - ".github/workflows/r-cristae-lmm.yml"

  pull_request:
    paths:
      - "scripts/R/Cristae_LMM.R"
      - "data/curated/cristae_manual.xlsx"
      - "data/curated/cristae_automated.xlsx"
      - ".github/workflows/r-cristae-lmm.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  cristae-lmm-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Verify input files
        run: |
          test -f scripts/R/Cristae_LMM.R
          test -f data/curated/cristae_manual.xlsx
          test -f data/curated/cristae_automated.xlsx

      - name: Install required R packages
        run: |
          Rscript -e '
            install.packages(
              c(
                "openxlsx",
                "lme4",
                "lmerTest",
                "emmeans",
                "ggplot2",
                "dplyr",
                "tidyr",
                "tibble",
                "stringr"
              )
            )
          '

      - name: Run cristae LMM analysis
        shell: bash
        run: |
          mkdir -p results/derived/cristae_lmm_safe
          set -o pipefail

          Rscript scripts/R/Cristae_LMM.R 2>&1 \
            | tee results/derived/cristae_lmm_safe/analysis_run.log

      - name: Verify Excel outputs
        run: |
          test -f results/derived/cristae_lmm_safe/manual/cristae_lmm_manual_safe_results.xlsx
          test -f results/derived/cristae_lmm_safe/automated/cristae_lmm_automated_safe_results.xlsx

      - name: Verify manual output directories
        run: |
          test -d results/derived/cristae_lmm_safe/manual/plots
          test -d results/derived/cristae_lmm_safe/manual/model_diagnostics

      - name: Verify automated output directories
        run: |
          test -d results/derived/cristae_lmm_safe/automated/plots
          test -d results/derived/cristae_lmm_safe/automated/model_diagnostics

      - name: Verify manual plots
        shell: bash
        run: |
          test -n "$(
            find results/derived/cristae_lmm_safe/manual/plots \
              -maxdepth 1 \
              -type f \
              -name '*.png' \
              -print \
              -quit
          )"

          test -n "$(
            find results/derived/cristae_lmm_safe/manual/plots \
              -maxdepth 1 \
              -type f \
              -name '*.pdf' \
              -print \
              -quit
          )"

      - name: Verify automated plots
        shell: bash
        run: |
          test -n "$(
            find results/derived/cristae_lmm_safe/automated/plots \
              -maxdepth 1 \
              -type f \
              -name '*.png' \
              -print \
              -quit
          )"

          test -n "$(
            find results/derived/cristae_lmm_safe/automated/plots \
              -maxdepth 1 \
              -type f \
              -name '*.pdf' \
              -print \
              -quit
          )"

      - name: Show generated output summary
        shell: bash
        run: |
          echo "Generated Excel files:"
          find results/derived/cristae_lmm_safe \
            -type f \
            -name '*.xlsx' \
            -print

          echo
          echo "Manual PNG plots:"
          find results/derived/cristae_lmm_safe/manual/plots \
            -type f \
            -name '*.png' \
            | wc -l

          echo "Manual PDF plots:"
          find results/derived/cristae_lmm_safe/manual/plots \
            -type f \
            -name '*.pdf' \
            | wc -l

          echo "Automated PNG plots:"
          find results/derived/cristae_lmm_safe/automated/plots \
            -type f \
            -name '*.png' \
            | wc -l

          echo "Automated PDF plots:"
          find results/derived/cristae_lmm_safe/automated/plots \
            -type f \
            -name '*.pdf' \
            | wc -l

          echo
          echo "Manual diagnostic files:"
          find results/derived/cristae_lmm_safe/manual/model_diagnostics \
            -type f \
            | wc -l

          echo "Automated diagnostic files:"
          find results/derived/cristae_lmm_safe/automated/model_diagnostics \
            -type f \
            | wc -l

      - name: Upload cristae LMM results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cristae-lmm-analysis-results
          path: |
            results/derived/cristae_lmm_safe/**
          if-no-files-found: warn
          retention-days: 14
