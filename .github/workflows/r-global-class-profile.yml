name: Test global cristae class profile

on:
  pull_request:
    paths:
      - "scripts/R/Global_class_profile_across_cristae_labels.R"
      - "data/curated/cristae_manual.xlsx"
      - "data/curated/cristae_automated.xlsx"
      - ".github/workflows/r-global-class-profile.yml"

  push:
    branches:
      - main
    paths:
      - "scripts/R/Global_class_profile_across_cristae_labels.R"
      - "data/curated/cristae_manual.xlsx"
      - "data/curated/cristae_automated.xlsx"
      - ".github/workflows/r-global-class-profile.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-class-profile-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Verify input files
        run: |
          test -f scripts/R/Global_class_profile_across_cristae_labels.R
          test -f data/curated/cristae_manual.xlsx
          test -f data/curated/cristae_automated.xlsx

      - name: Install required R packages
        run: |
          Rscript -e '
            install.packages(
              c(
                "readxl",
                "dplyr",
                "tidyr",
                "ggplot2",
                "openxlsx"
              )
            )
          '

      - name: Run global cristae class profile analysis
        run: |
          Rscript scripts/R/Global_class_profile_across_cristae_labels.R

      - name: Verify generated outputs
        run: |
          test -f results/derived/global_class_profile/global_class_profile_data.xlsx
          test -f results/derived/global_class_profile/global_class_profile_dumbbell_colored.png
          test -f results/derived/global_class_profile/global_class_profile_dumbbell_colored.pdf

      - name: Show generated files
        run: |
          find results/derived/global_class_profile -maxdepth 1 -type f -print

      - name: Upload global class profile results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-class-profile-results
          path: |
            results/derived/global_class_profile/**
          if-no-files-found: error
          retention-days: 14
